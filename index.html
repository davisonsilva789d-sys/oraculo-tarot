<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo de Tarot Existencial</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background: #08020f;
            background-image: radial-gradient(circle at 50% 20%, #1a0933, #08020f 80%);
            color: #f3e5ab;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-panel {
            background: rgba(21, 10, 33, 0.85);
            border: 1px solid #dfb76c;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 20px rgba(223, 183, 108, 0.15);
            position: relative;
        }

        .category {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #dfb76c;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #fff8e7;
            font-weight: bold;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-opt {
            background: rgba(10, 5, 20, 0.6);
            border: 1px solid #dfb76c44;
            color: #f3e5ab;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-opt:hover {
            border-color: #dfb76c;
            background: rgba(223, 183, 108, 0.15);
        }

        .btn-opt:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-opt span {
            font-weight: bold;
            color: #dfb76c;
        }

        .chat-panel {
            background: rgba(15, 8, 25, 0.9);
            border: 1px solid #dfb76c55;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 420px;
            overflow: hidden;
        }

        .chat-header {
            padding: 12px 15px;
            background: rgba(223, 183, 108, 0.1);
            border-bottom: 1px solid #dfb76c33;
            font-size: 0.9rem;
            color: #dfb76c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .msg.user {
            align-self: flex-end;
            background: #dfb76c22;
            border: 1px solid #dfb76c66;
            color: #fff8e7;
        }

        .msg.ai {
            align-self: flex-start;
            background: #1e1233;
            border: 1px solid #3d2366;
            color: #d1c2eb;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            gap: 8px;
            border-top: 1px solid #dfb76c33;
            background: rgba(5, 2, 10, 0.8);
        }

        .chat-input-area input {
            flex: 1;
            min-width: 0;
            background: #0f0819;
            border: 1px solid #dfb76c44;
            padding: 10px 15px;
            border-radius: 20px;
            color: #fff8e7;
            outline: none;
        }

        .chat-input-area button {
            background: #dfb76c;
            color: #08020f;
            border: none;
            padding: 0 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-input-area button:disabled {
            opacity: 0.5;
        }

        .api-key-bar {
            background: rgba(223, 183, 108, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        .api-key-bar span {
            font-size: 0.8rem;
            color: #dfb76c;
        }

        .api-key-bar .secure-status {
            color: #d1c2eb;
            font-size: 0.8rem;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(8, 2, 15, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .star {
            width: 30px;
            height: 30px;
            background: #dfb76c;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: spin 1.2s infinite linear;
        }

        @keyframes spin {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(2.5) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card-panel">

            <div class="api-key-bar">
                <span>✦ API AI Groq:</span>
                <span class="secure-status">Conexão protegida pelo servidor</span>
            </div>

            <div class="category">Harmonia Existencial</div>

            <div class="question-text" id="questionBox">
                "A verdadeira sabedoria reside no avanço da ciência ou no retorno à simplicidade da natureza?"
            </div>

            <div class="options-grid">

                <button class="btn-opt" onclick="selectOption('Minha resposta é positiva: concordo com a ideia central da pergunta.')">
                    <span>✓</span>
                    Positivo
                </button>

                <button class="btn-opt" onclick="selectOption('Minha resposta é negativa: discordo da ideia central da pergunta.')">
                    <span>✕</span>
                    Negativo
                </button>

                <button class="btn-opt" onclick="selectOption('Não escolho nenhuma das opções. Quero explorar uma terceira perspectiva.')">
                    <span>⚖</span>
                    Nenhuma das opções
                </button>

                <button class="btn-opt" id="newQuestionButton" onclick="generateNewQuestion()">
                    <span>↻</span>
                    Rolar nova carta
                </button>

            </div>
        </div>

        <div class="chat-panel">

            <div class="chat-header">
                <span>✦ Conselheiro Oracular (AI Groq)</span>
                <span style="font-size:0.75rem; opacity:0.7;" id="connectionStatus">Online</span>
            </div>

            <div class="chat-box" id="chatBox">
                <div class="msg ai">
                    Saudações, viajante. Qual reflexão você traz ao oráculo hoje?
                </div>
            </div>

            <div class="chat-input-area">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Converse com o oráculo..."
                    onkeydown="if(event.key==='Enter') sendChatMessage()"
                >

                <button id="sendButton" onclick="sendChatMessage()">
                    Enviar
                </button>
            </div>

        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="star"></div>
    </div>

    <script>

        let chatHistory = [];

        let currentQuestion =
            "A verdadeira sabedoria reside no avanço da ciência ou no retorno à simplicidade da natureza?";

        let askedQuestions = JSON.parse(
            localStorage.getItem('tarot_asked_questions') || '[]'
        );

        let isSending = false;

        // Comunicação protegida com o servidor Groq.
        // A rota /api/gemini permanece igual porque é a rota configurada no server.js.
        async function callGroq(contents) {

            const conversation = contents.map(message => {
                const role = message.role === 'model' ? 'Conselheiro Oracular' : 'Usuário';

                const messageText = message.parts
                    .map(part => part.text || '')
                    .join('\n');

                return `${role}:\n${messageText}`;
            }).join('\n\n');

            const response = await fetch('/api/gemini', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    prompt: conversation
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Erro ao consultar o servidor.');
            }

            if (!data.text) {
                throw new Error('A AI Groq não retornou uma resposta.');
            }

            return data.text;
        }

        // Conversa com o Conselheiro
        async function sendChatMessage() {

            if (isSending) return;

            const input = document.getElementById('userInput');
            const sendButton = document.getElementById('sendButton');

            const text = input.value.trim();

            if (!text) return;

            isSending = true;
            sendButton.disabled = true;
            input.disabled = true;

            appendMsg(text, 'user');
            input.value = '';

            const loadingId = appendMsg(
                'O Oráculo consulta os astros...',
                'ai'
            );

            chatHistory.push({
                role: 'user',
                parts: [{ text: text }]
            });

            try {

                const systemPrompt = `
Você é o Conselheiro Oracular, um sábio e místico Leitor de Tarot e Conselheiro Existencial.

Sua personalidade deve ser profunda, reflexiva, filosófica, misteriosa e acolhedora.

Sua função é conduzir reflexões existenciais, interpretar simbolicamente as questões apresentadas e estimular o pensamento crítico e o autoconhecimento.

Não seja um chatbot genérico.
Não transforme todas as conversas em consultas amorosas.
Não invente certezas sobre o futuro.
Não imponha crenças ou opiniões.
Não responda de maneira excessivamente curta ou superficial.

Pergunta existencial atual:
"${currentQuestion}"

Conduza a conversa com naturalidade, considerando o histórico apresentado.

Responda em português brasileiro.
`;

                const contentsPayload = [
                    {
                        role: 'user',
                        parts: [{ text: systemPrompt }]
                    },
                    ...chatHistory
                ];

                const aiReply = await callGroq(contentsPayload);

                document.getElementById(loadingId).innerText = aiReply;

                chatHistory.push({
                    role: 'model',
                    parts: [{ text: aiReply }]
                });

            } catch (err) {

                document.getElementById(loadingId).innerText =
                    `[Erro na resposta]: ${err.message}`;

                chatHistory.pop();

            } finally {

                isSending = false;
                sendButton.disabled = false;
                input.disabled = false;
                input.focus();

            }
        }

        // Seleção de uma das três respostas
        function selectOption(optionText) {

            if (isSending) return;

            document.getElementById('userInput').value = optionText;

            sendChatMessage();
        }

        // Geração de uma nova pergunta existencial
        async function generateNewQuestion() {

            if (isSending) return;

            const button = document.getElementById('newQuestionButton');

            button.disabled = true;
            showLoading(true);

            try {

                const previousQuestions = [
                    currentQuestion,
                    ...askedQuestions
                ];

                const promptText = `
Você é um criador de perguntas filosóficas e existenciais.

Gere UMA única pergunta inédita, profunda e instigante.

A pergunta deve estimular a reflexão sobre existência, sociedade, ciência, natureza, consciência, ética, humanidade ou filosofia.

Evite perguntas genéricas e não repita nenhuma das perguntas abaixo:

${previousQuestions.map(q => '- ' + q).join('\n')}

Retorne somente o texto da pergunta, sem explicações, sem numeração e sem aspas.
`;

                const contents = [{
                    role: 'user',
                    parts: [{ text: promptText }]
                }];

                const newQuestionRaw = await callGroq(contents);

                const newQuestion = newQuestionRaw
                    .trim()
                    .replace(/^["'“”]+|["'“”]+$/g, '');

                if (!newQuestion) {
                    throw new Error('A IA não gerou uma pergunta válida.');
                }

                if (previousQuestions.some(q =>
                    q.toLowerCase().trim() === newQuestion.toLowerCase().trim()
                )) {
                    throw new Error('A pergunta gerada já foi utilizada. Tente novamente.');
                }

                currentQuestion = newQuestion;

                document.getElementById('questionBox').innerText =
                    `"${newQuestion}"`;

                askedQuestions.push(newQuestion);

                localStorage.setItem(
                    'tarot_asked_questions',
                    JSON.stringify(askedQuestions)
                );

                chatHistory = [];

                document.getElementById('chatBox').innerHTML = '';

                appendMsg(
                    `Uma nova carta se revela: "${newQuestion}". O que sua intuição diz?`,
                    'ai'
                );

            } catch (e) {

                alert(`Erro ao sortear nova carta: ${e.message}`);

            } finally {

                button.disabled = false;
                showLoading(false);

            }
        }

        // Adiciona mensagens ao chat
        function appendMsg(text, sender) {

            const chatBox = document.getElementById('chatBox');

            const msg = document.createElement('div');

            msg.id = 'msg-' + Date.now() + '-' + Math.random().toString(36).slice(2);

            msg.className = `msg ${sender}`;

            msg.innerText = text;

            chatBox.appendChild(msg);

            chatBox.scrollTop = chatBox.scrollHeight;

            return msg.id;
        }

        // Animação da estrela
        function showLoading(active) {

            const overlay = document.getElementById('loadingOverlay');

            if (active) {
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        }

    </script>

</body>
</html>
